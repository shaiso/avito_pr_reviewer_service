version: "3.9"

services:
  db:
    image: postgres:16
    container_name: pr_db
    environment:
      POSTGRES_DB: pr_service
      POSTGRES_USER: pr_user
      POSTGRES_PASSWORD: pr_pass
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_user -d pr_service"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  migrate:
    image: postgres:16
    container_name: pr_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: pr_pass
    volumes:
      - ./migrations:/migrations:ro
    command: >
      bash -c "
      psql -h db -U pr_user -d pr_service -f /migrations/0001_init.sql
      "
    restart: "no"

  app:
    build: .
    container_name: pr_app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_DSN: postgres://pr_user:pr_pass@db:5432/pr_service?sslmode=disable
      ADMIN_TOKEN: supersecretadmin
    ports:
      - "8080:8080"

volumes:
  dbdata: